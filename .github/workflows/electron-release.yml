name: Build and publish Electron app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    # Native module rebuilds (better-sqlite3) need to happen on the real
    # target OS, so each platform builds and publishes its own artifacts
    # rather than cross-compiling from one runner.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Electron app
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
