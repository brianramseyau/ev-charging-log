name: Build and publish Electron app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # electron-builder's GitHub publisher creates a release itself if none
  # exists yet for the tag - but with no title/notes, just a bare stub.
  # Create the real release (title + notes taken from the annotated tag)
  # first, so the matrix jobs below find it already there and only need to
  # attach build artifacts to it.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
            exit 0
          fi
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          NOTES="$(git tag -l --format='%(contents:body)' "$TAG")"
          if [ -z "$TITLE" ]; then
            TITLE="$TAG"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"

  release:
    needs: prepare-release
    # prepare-release only runs (and can fail) on a tag push; on a manual
    # workflow_dispatch run it's skipped, and that must not skip this job too.
    if: always() && needs.prepare-release.result != 'failure'
    # Native module rebuilds (better-sqlite3) need to happen on the real
    # target OS, so each platform builds and publishes its own artifacts
    # rather than cross-compiling from one runner.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Electron app
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SvelteKit's postbuild step imports hooks.server.ts (which opens the db
          # connection) to analyse the route graph, so it needs *some* writable
          # DATABASE_URL even though this build-time database is discarded — the
          # real path is set at runtime in electron/main.cjs.
          DATABASE_URL: ${{ runner.temp }}/build-time.db
