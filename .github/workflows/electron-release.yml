name: Build and publish Electron app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # electron-builder's GitHub publisher creates a release itself if none
  # exists yet for the tag - but with no title/notes, just a bare stub.
  # Create the real release first (tag/title/notes below), so the matrix
  # jobs find it already there and only need to attach build artifacts.
  # The tag is always derived from package.json's version rather than
  # github.ref, so this works the same whether the run came from a tag
  # push or a manual workflow_dispatch (e.g. pushing a new "v*" tag can
  # be blocked by tag-protection rules that don't apply to this job's
  # own GITHUB_TOKEN creating the release+tag via the API).
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
            exit 0
          fi
          SUBTITLE="$(sed -n '1p' RELEASE_NOTES.md)"
          TITLE="$TAG"
          if [ -n "$SUBTITLE" ]; then
            TITLE="$TAG - $SUBTITLE"
          fi
          NOTES="$(tail -n +3 RELEASE_NOTES.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"

  release:
    needs: prepare-release
    # Native module rebuilds (better-sqlite3) need to happen on the real
    # target OS, so each platform builds and publishes its own artifacts
    # rather than cross-compiling from one runner.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Electron app
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SvelteKit's postbuild step imports hooks.server.ts (which opens the db
          # connection) to analyse the route graph, so it needs *some* writable
          # DATABASE_URL even though this build-time database is discarded — the
          # real path is set at runtime in electron/main.cjs.
          DATABASE_URL: ${{ runner.temp }}/build-time.db
