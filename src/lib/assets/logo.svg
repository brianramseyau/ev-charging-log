<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>EV Charging Log</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- maskable-safe background: fills the full square so PWA maskable icons crop cleanly -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- car silhouette -->
  <g transform="translate(66,232)">
    <path d="M8 96
             C 8 70 24 58 46 54
             L 70 20
             C 78 8 92 2 108 2
             L 300 2
             C 316 2 330 8 338 20
             L 362 54
             C 384 58 400 70 400 96
             L 400 132
             C 400 140 393 146 385 146
             L 360 146
             C 360 125 343 108 322 108
             C 301 108 284 125 284 146
             L 124 146
             C 124 125 107 108 86 108
             C 65 108 48 125 48 146
             L 23 146
             C 15 146 8 140 8 132
             Z"
          fill="#f8fafc"/>
    <!-- windows -->
    <path d="M96 54 L 118 22 C 122 16 129 12 137 12 L 200 12 L 200 54 Z" fill="#0369a1" opacity="0.85"/>
    <path d="M212 12 L 271 12 C 279 12 286 16 290 22 L 312 54 L 212 54 Z" fill="#0369a1" opacity="0.85"/>
    <!-- wheels -->
    <circle cx="86" cy="146" r="30" fill="#111827"/>
    <circle cx="86" cy="146" r="12" fill="#cbd5e1"/>
    <circle cx="322" cy="146" r="30" fill="#111827"/>
    <circle cx="322" cy="146" r="12" fill="#cbd5e1"/>
  </g>

  <!-- charging bolt, overlapping the body like a plug/charge indicator -->
  <path d="M270 120
           L206 232
           L246 232
           L226 320
           L308 196
           L262 196
           Z"
        fill="url(#bolt)" stroke="#78350f" stroke-width="4" stroke-linejoin="round"/>
</svg>
